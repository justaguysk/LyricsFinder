<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <title>LyricsFinder</title>
    <link id="generalcss" rel="stylesheet" href="assets/styles/general-dark.css">
    <link id="headercss" rel="stylesheet" href="assets/styles/header-dark.css">
    <link id="footercss" rel="stylesheet" href="assets/styles/footer-dark.css">
    <link rel="stylesheet" href="assets/styles/lyricspage.css">
    <link id="alertcss" rel="stylesheet" href="assets/styles/alert-button-dark.css">
  </head>
  <body>
    <div id="header">
      <img id="coverArt" class="image" src="noimage.png" alt="cover">
      <div id="trackinfo">
        <p id="trackName">Track</p>
        <p id="artistName">Artist</p>
      </div>
    </div>
    <div>
      <p id="lyrics">
        . . .
      </p>
    </div>
    <div id="footer">
      <div class="buttonsdiv">
        <button id="quitButton" class="button quits">
          <img id="quitImg" class="foot-image" src="assets/quit-dark.png" alt="quit">
        </button>
        <button id="switchButton" class="button">
          <img id="switchImg" class="foot-image" src="assets/darkmode.png" alt="mode">
        </button>
      </div>
      <div class="statusdiv">
        <p id="player">N/A</p>
        <p id="sep">&nbsp; - &nbsp;</p>
        <p id="status">N/A</p>
      </div>
    </div>
    <div id="nolinux">
      <div class="no">
        <p class="notext">This program currently supports Linux devices only.</p>
        <button class="yesbutton quits">Quit</button>
      </div>
    </div>
    <div id="nopython">
      <div class="no">
        <p class="notext">This program requires Python to be installed on your device.</p>
        <div class="multibuttons">
          <button class="nobutton quits">Quit</button>
          <button id="installpy" class="yesbutton">Install</button>
        </div>
      </div>
    </div>
    <div id="noplayerctl">
      <div class="no">
        <p class="notext">This program requires playerctl to be installed on your device.</p>
        <div class="multibuttons">
          <button id="quitplayer" class="nobutton quits">Quit</button>
          <button id="installplayer" class="yesbutton">Install</button>
        </div>
      </div>
    </div>
  </body>
  <script src="./renderer.js"></script>
</html>
